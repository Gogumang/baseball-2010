<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no" />
    <meta name="theme-color" content="#05070d" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <title>캠퍼스 프로야구 — 나만의 타자</title>
    <!--
      원본 글꼴 웹폰트 (app/styles/global.css.ts, display: block) — 첫 화면(이용안내) 글자가 이 글꼴이 올 때까지 안 보인다.
      스크립트를 받고 글자를 그린 뒤에야 받기 시작하지 않게 처음부터 같이 받는다(r224).
    -->
    <link rel="preload" href="/font/synGak9.woff2" as="font" type="font/woff2" crossorigin />
    <!--
      Galmuri: 한글 도트 폰트 (SIL OFL). 피처폰 화면 느낌을 만드는 핵심 요소.
      CDN이 막혀도 monospace로 떨어지도록 styles.css에 대체 스택을 둔다.
      판을 박는다(2.40.3 — 10-27 판 없는 주소가 내준 판, CSS · woff2 바이트 같음 확인). 판 없는 주소는 CDN 최신을 따라가 글자 그림이 저절로 바뀐다(r321).
      원본 글꼴(synGak9)에 없는 글자에만 쓰는 대체 글꼴이라 첫 그림을 막지 않게 받는다(media 를 print 로 받았다가 다 오면 all) —
      다른 곳(CDN)의 막는 스타일시트는 연결을 새로 열어야 해서 첫 그림과 스크립트 실행을 함께 늦춘다(r224).
    -->
    <link rel="preconnect" href="https://cdn.jsdelivr.net" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/galmuri@2.40.3/dist/galmuri.css" media="print" onload="this.media = 'all'" />
  </head>
  <body>
    <div id="root"></div>
    <!-- 터치 버튼 자리 (app/ui/ViewportShell) — 터치 기기에서만 채운다 -->
    <div id="keypad-root"></div>
    <script type="module" src="/src/app/main.tsx"></script>
  </body>
</html>
